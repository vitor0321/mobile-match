name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Build and test Functions with Firestore Emulator
        run: npm test --prefix functions

      - name: Test Kotlin product modules
        run: >-
          ./gradlew
          :products:identity:testDebugUnitTest
          :products:games:testDebugUnitTest
          :products:games:compileDebugKotlinAndroid
          --no-configuration-cache
          --stacktrace
          --console=plain

      - name: Create placeholder google-services.json
        run: |
          if [ -f app/google-services.json ]; then exit 0; fi
          client() {
            cat <<EOF
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:$2",
                  "android_client_info": { "package_name": "$1" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "ci-placeholder-key" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
          EOF
          }
          cat > app/google-services.json <<EOF
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              $(client com.walcker.match.app 0000000000000000),
              $(client com.walcker.match.app.dev 0000000000000001)
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Verify unit test coverage floor
        run: ./gradlew :koverVerify --no-configuration-cache --console=plain

      - name: Upload Firebase emulator logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-emulator-logs
          path: functions/firebase-debug.log
          if-no-files-found: ignore

  # iOS só era compilado na tag `v*` (ios-release.yml). Três quebras de
  # commonMain passaram por esse buraco sem ninguém ver: `Math.toRadians` no
  # NearbyMatch, `System.currentTimeMillis` no perfil e `Clock.System` no
  # InMemoryPlayerCache. Nenhuma delas aparece no build Android.
  ios-compile:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin/Native for iOS simulator
        run: >-
          ./gradlew
          :products:games:compileKotlinIosSimulatorArm64
          :products:identity:compileKotlinIosSimulatorArm64
          --no-configuration-cache
          --stacktrace
          --console=plain
