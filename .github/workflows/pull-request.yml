name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Build and test Functions with Firestore Emulator
        run: npm test --prefix functions

      - name: Test Kotlin product modules
        run: >-
          ./gradlew
          :products:identity:testDebugUnitTest
          :products:bible:testDebugUnitTest
          :products:bible:compileDebugKotlinAndroid
          --no-configuration-cache
          --stacktrace
          --console=plain

      - name: Upload Firebase emulator logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-emulator-logs
          path: functions/firebase-debug.log
          if-no-files-found: ignore
