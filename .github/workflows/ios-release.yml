name: iOS Release to App Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release secrets
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
          ADMOB_IOS_BANNER_UNIT_ID: ${{ secrets.ADMOB_IOS_BANNER_UNIT_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT_BASE64 }}
        run: |
          required_secrets=(
            DEVELOPMENT_TEAM
            ADMOB_IOS_APP_ID
            ADMOB_IOS_BANNER_UNIT_ID
            IOS_DISTRIBUTION_CERTIFICATE_P12
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
            IOS_PROVISIONING_PROFILE
            IOS_PROVISIONING_PROFILE_NAME
            APP_STORE_CONNECT_API_KEY_ID
            APP_STORE_CONNECT_API_ISSUER_ID
            APP_STORE_CONNECT_API_KEY_CONTENT_BASE64
          )

          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name}" ]; then
              echo "${secret_name} secret is required" >&2
              exit 1
            fi
          done

      - name: Validate iOS release inputs
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          APP_STORE_CONNECT_API_KEY_CONTENT_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required_files = [
              Path("iosApp/Podfile"),
              Path("iosApp/Podfile.lock"),
              Path("iosApp/iosApp/GoogleService-Info.plist"),
              Path("iosApp/iosApp.xcworkspace/contents.xcworkspacedata"),
              Path("iosApp/Configuration/Release.xcconfig"),
              Path("iosApp/iosApp.xcodeproj/project.pbxproj"),
          ]

          missing_files = [str(path) for path in required_files if not path.exists()]
          if missing_files:
              raise SystemExit(f"Missing required iOS release files: {', '.join(missing_files)}")

          def ensure_base64(name: str) -> None:
              raw = os.environ[name]
              try:
                  base64.b64decode(raw, validate=True)
              except Exception as exc:
                  raise SystemExit(f"{name} is not valid base64: {exc}")

          ensure_base64("IOS_DISTRIBUTION_CERTIFICATE_P12")
          ensure_base64("IOS_PROVISIONING_PROFILE")
          ensure_base64("APP_STORE_CONNECT_API_KEY_CONTENT_BASE64")
          print("iOS release inputs look valid.")
          PY

  build-and-deploy:
    needs: validate-config
    runs-on: macos-15
    timeout-minutes: 60
    env:
      XCODE_WORKSPACE: iosApp/iosApp.xcworkspace
      XCODE_SCHEME: iosApp
      XCODEBUILD_LOG_DIR: ${{ github.workspace }}/iosApp/xcodebuild-logs
      DIAGNOSTICS_DIR: ${{ github.workspace }}/iosApp/release-diagnostics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Generate temporary keychain password
        id: keychain
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)-${{ github.run_id }}"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "password=$KEYCHAIN_PASSWORD" >> $GITHUB_OUTPUT

      # Java (KMP)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Gradle cache
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            iosApp/Pods
            ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('iosApp/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      # Secrets.xcconfig
      - name: Create Secrets.xcconfig
        run: |
          {
            echo "DEVELOPMENT_TEAM=${{ secrets.DEVELOPMENT_TEAM }}"
            echo "ADMOB_APP_ID=${{ secrets.ADMOB_IOS_APP_ID }}"
            echo "ADMOB_BANNER_UNIT_ID=${{ secrets.ADMOB_IOS_BANNER_UNIT_ID }}"
            echo "IOS_PROVISIONING_PROFILE_NAME=${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}"
          } > iosApp/Secrets.xcconfig

      - name: Install CocoaPods dependencies
        run: |
          cd iosApp
          pod install --deployment

      # 🔐 Certificado
      - name: Import Distribution Certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ steps.keychain.outputs.password }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          printf '%s' "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12

          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -f pkcs12

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

      # 📱 Provisioning Profile
      - name: Import Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          PROFILE_NAME_EXPECTED: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision

          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          PROFILE_PLIST=$RUNNER_TEMP/profile.plist
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_NAME=$(plutil -extract Name raw -o - "$PROFILE_PLIST")
          PROFILE_UUID=$(plutil -extract UUID raw -o - "$PROFILE_PLIST")
          APP_IDENTIFIER=$(plutil -extract Entitlements.application-identifier raw -o - "$PROFILE_PLIST")
          EXPECTED_APP_IDENTIFIER="${DEVELOPMENT_TEAM}.org.walcker.match.Match"

          echo "Provisioning Profile Name: $PROFILE_NAME"
          echo "Provisioning Profile UUID: $PROFILE_UUID"
          echo "Provisioning App Identifier: $APP_IDENTIFIER"

          if [ "$PROFILE_NAME" != "$PROFILE_NAME_EXPECTED" ]; then
            echo "Provisioning profile name mismatch. Expected '$PROFILE_NAME_EXPECTED' but found '$PROFILE_NAME'." >&2
            exit 1
          fi

          if [ "$APP_IDENTIFIER" != "$EXPECTED_APP_IDENTIFIER" ] && [ "$APP_IDENTIFIER" != "${DEVELOPMENT_TEAM}.*" ]; then
            echo "Provisioning profile app identifier mismatch. Expected '$EXPECTED_APP_IDENTIFIER' or wildcard '${DEVELOPMENT_TEAM}.*' but found '$APP_IDENTIFIER'." >&2
            exit 1
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      # ExportOptions
      - name: Create ExportOptions.plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.DEVELOPMENT_TEAM }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>org.walcker.match.Match</key>
              <string>${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          EOF

      # 🧠 Bump version
      - name: Increment build number
        id: bump
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 1000 ))
          echo "Build number: $BUILD_NUMBER"
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      # 🔍 Diagnose signing identities
      - name: List signing identities
        run: |
          echo "=== Certificates in keychain ==="
          security find-identity -v -p codesigning $RUNNER_TEMP/build.keychain-db || true
          echo "=== All identities ==="
          security find-identity -v $RUNNER_TEMP/build.keychain-db || true

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/Match.xcarchive \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/build.keychain-db" \
            CURRENT_PROJECT_VERSION="${{ steps.bump.outputs.build_number }}" \
            2>&1 | tee "$XCODEBUILD_LOG_DIR/archive.log"

      # 📦 Export IPA
      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Match.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            2>&1 | tee "$XCODEBUILD_LOG_DIR/export.log"

      - name: Resolve exported IPA
        id: exported_ipa
        run: |
          echo "=== Export directory contents ==="
          ls -la "$RUNNER_TEMP/export"

          IPA_PATH=$(find "$RUNNER_TEMP/export" -maxdepth 1 -type f -name "*.ipa" | head -n 1)

          if [ -z "$IPA_PATH" ]; then
            echo "No .ipa file was generated in $RUNNER_TEMP/export" >&2
            find "$RUNNER_TEMP/export" -maxdepth 2 -print
            exit 1
          fi

          FINAL_IPA_PATH="$RUNNER_TEMP/Match.ipa"
          cp "$IPA_PATH" "$FINAL_IPA_PATH"

          echo "ipa_path=$FINAL_IPA_PATH" >> $GITHUB_OUTPUT
          echo "Resolved IPA: $FINAL_IPA_PATH"

      # 🚀 Upload
      # TODO: migrar para xcrun notarytool quando altool for removido (deprecated desde Xcode 14)
      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT_BASE64 }}
        run: |
          set -o pipefail
          mkdir -p ~/.appstoreconnect/private_keys

          echo "$APP_STORE_CONNECT_API_KEY_CONTENT_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          IPA_PATH="${{ steps.exported_ipa.outputs.ipa_path }}"
          echo "Uploading: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            2>&1 | tee "$XCODEBUILD_LOG_DIR/upload.log"

      - name: Show failure diagnostics
        if: failure()
        run: |
          echo "=== Available log files ==="
          ls -la "$XCODEBUILD_LOG_DIR" || true

          for log_file in \
            "$XCODEBUILD_LOG_DIR/archive.log" \
            "$XCODEBUILD_LOG_DIR/export.log" \
            "$XCODEBUILD_LOG_DIR/upload.log"; do
            if [ -f "$log_file" ]; then
              echo "=== Error markers: $(basename "$log_file") ==="
              grep -nE '(^error:| error: |^\*\* .*FAILED \*\*|No signing certificate|No profiles for|Provisioning profile|requires a provisioning profile|does not support provisioning profiles|PhaseScriptExecution|Command .* failed)' "$log_file" | tail -n 200 || true

              echo "=== Tail: $(basename "$log_file") ==="
              tail -n 200 "$log_file"
            fi
          done

          if find /var/folders -type d -name "*.xcdistributionlogs" 2>/dev/null | grep -q .; then
            echo "=== xcdistributionlogs found ==="
            find /var/folders -type d -name "*.xcdistributionlogs" 2>/dev/null
          fi

      - name: Collect iOS release diagnostics
        if: always()
        run: |
          rm -rf "$DIAGNOSTICS_DIR"
          mkdir -p "$DIAGNOSTICS_DIR"
          echo "workflow_run=${{ github.run_id }}" > "$DIAGNOSTICS_DIR/inventory.txt"

          if [ -d "$XCODEBUILD_LOG_DIR" ]; then
            mkdir -p "$DIAGNOSTICS_DIR/xcodebuild-logs"
            cp -R "$XCODEBUILD_LOG_DIR"/. "$DIAGNOSTICS_DIR/xcodebuild-logs/"
          fi

          for path in \
            "$RUNNER_TEMP/ExportOptions.plist" \
            "$RUNNER_TEMP/Match.xcarchive" \
            "$RUNNER_TEMP/export"; do
            if [ -e "$path" ]; then
              cp -R "$path" "$DIAGNOSTICS_DIR/"
            fi
          done

          mkdir -p "$DIAGNOSTICS_DIR/xcdistributionlogs"
          while IFS= read -r bundle_path; do
            cp -R "$bundle_path" "$DIAGNOSTICS_DIR/xcdistributionlogs/"
          done < <(find /var/folders -type d -name "*.xcdistributionlogs" 2>/dev/null)

          find "$DIAGNOSTICS_DIR" -maxdepth 3 -print >> "$DIAGNOSTICS_DIR/inventory.txt"

      - name: Upload iOS release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-diagnostics
          path: ${{ env.DIAGNOSTICS_DIR }}
          if-no-files-found: ignore

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain-db || true
